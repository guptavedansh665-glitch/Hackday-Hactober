<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KissanAI — Dhenu Agricultural AI Operating System</title>
  <!-- Tailwind CSS with Fallback -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM with Dual CDN Fallbacks -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js'"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js'"></script>
  <!-- Babel Standalone for JSX Transformation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/@babel/standalone/babel.min.js'"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-indic { font-family: 'Noto Sans Bengali', 'Noto Sans Devanagari', 'Plus Jakarta Sans', sans-serif; }
    .bg-light-pattern {
      background-color: #f8fafc;
      background-image: radial-gradient(rgba(16, 185, 129, 0.12) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.25; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-ring { animation: pulse-ring 2.5s infinite ease-in-out; }
  </style>
</head>
<body class="bg-light-pattern text-slate-800 min-h-screen antialiased selection:bg-emerald-500 selection:text-white">
  <!-- Interactive React Root with Instant Visual Loading Shell -->
  <div id="root">
    <div class="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white font-indic p-6">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-3xl shadow-xl shadow-emerald-500/30 animate-bounce mb-4">
        🌾
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight mb-1 text-center">KissanAI • KisanVaani Platform</h1>
      <p class="text-xs text-emerald-400 font-semibold mb-6 text-center">Dhenu Agro AI 2.0 • Multilingual Agricultural Operating System</p>
      
      <div class="w-72 bg-slate-800 rounded-full p-1 border border-slate-700 shadow-inner mb-4">
        <div class="h-2 bg-gradient-to-r from-emerald-500 to-teal-400 rounded-full animate-pulse" style="width: 85%"></div>
      </div>
      
      <p class="text-[11px] text-slate-400 text-center flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span>Connecting to PostgreSQL 18 & Dhenu Engine...</span>
      </p>

      <div id="client-error-box" class="mt-6 max-w-md w-full hidden"></div>
    </div>
  </div>

  <script>
    // File protocol detector
    if (window.location.protocol === 'file:') {
      window.addEventListener('DOMContentLoaded', function() {
        var box = document.getElementById('client-error-box');
        if (box) {
          box.classList.remove('hidden');
          box.innerHTML = '<div class="p-4 rounded-2xl bg-amber-950/90 border border-amber-600 text-amber-100 text-xs shadow-xl">' +
            '<div class="flex items-center gap-2 text-amber-400 font-bold mb-1"><span>⚡</span><span>Local Development Server Recommended</span></div>' +
            '<p class="text-[11px] text-amber-200/90 mb-2">You opened this file directly via <code>file://</code>. To run the modular React app, start the KisanVaani server and open in browser:</p>' +
            '<div class="flex gap-2 items-center">' +
            '<a href="http://localhost:3000" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-[11px] transition">Open http://localhost:3000</a>' +
            '<code class="px-2 py-1 bg-slate-900 text-emerald-400 text-[10px] rounded">npm start</code>' +
            '</div></div>';
        }
      });
    }

    // Global Error Catcher for Browser Diagnostics
    window.addEventListener('error', function(e) {
      console.error('[KissanAI Diagnostic]', e.message, e.filename, e.lineno);
      var box = document.getElementById('client-error-box');
      if (box) {
        box.classList.remove('hidden');
        box.innerHTML = '<div class="p-4 rounded-2xl bg-red-950/90 border border-red-700 text-red-200 text-xs font-mono shadow-xl">' +
          '<div class="flex items-center gap-2 text-red-400 font-bold mb-1"><span>⚠️</span><span>System Diagnostic</span></div>' +
          '<p class="text-[11px] text-slate-300">' + (e.message || 'Script initialization event') + '</p>' +
          '<div class="mt-3 flex gap-2">' +
          '<a href="http://localhost:3000" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-[11px] transition">Open on Port 3000</a>' +
          '<button onclick="window.location.reload()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-lg text-[11px] transition">Reload</a>' +
          '</div></div>';
      }
    });
  </script>

  <!-- React JSX Application Components -->
  <script type="text/babel" data-presets="react" src="/App.jsx"></script>
  <script type="text/babel" data-presets="react" src="/index.jsx"></script>
</body>
</html>
