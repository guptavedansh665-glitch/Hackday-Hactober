<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KisanVaani AI — Open Source Community Translation & Safety Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .badge-cibrc { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Standard CIBRC Safety Data
    const SAMPLE_DATASET = [
      {
        id: "CIBRC-CHL-001",
        name: "Chlorpyrifos 20% EC",
        triangle: "Yellow",
        triangleClass: "bg-yellow-500 text-slate-950",
        label: "WARNING - HIGHLY TOXIC",
        dose: "2.0 ml to 2.5 ml / Litre",
        phi: "15 Days",
        crops: "Paddy, Cotton, Sugarcane",
        antidote: "Atropine sulphate (2-4 mg IV). Do NOT induce vomiting."
      },
      {
        id: "CIBRC-IMI-002",
        name: "Imidacloprid 17.8% SL",
        triangle: "Blue",
        triangleClass: "bg-blue-500 text-white",
        label: "CAUTION - MODERATELY TOXIC",
        dose: "0.5 ml to 0.75 ml / Litre",
        phi: "21 Days",
        crops: "Cotton, Chilli, Tomato",
        antidote: "Symptomatic treatment, gastric lavage. Maintain hydration."
      },
      {
        id: "CIBRC-MAN-003",
        name: "Mancozeb 75% WP",
        triangle: "Green",
        triangleClass: "bg-emerald-500 text-white",
        label: "CAUTION - SLIGHTLY TOXIC",
        dose: "2.0 g to 2.5 g / Litre",
        phi: "7 Days",
        crops: "Potato, Tomato, Grapes",
        antidote: "Gastric lavage with sodium bicarbonate. Treat symptomatically."
      }
    ];

    const INITIAL_REVIEWS = [
      {
        id: "rev-101",
        lang: "Bengali (bn)",
        key: "dosage_and_mixing.dosage_instruction",
        source: "Mix exactly {dose_amount} per {water_volume} of clean water.",
        proposed: "পরিষ্কার জলের প্রতি {water_volume} এ ঠিক {dose_amount} মেশান।",
        contributor: "Anirban_KisanVolunteer",
        timestamp: "10 mins ago",
        status: "PENDING",
        isSafetyCritical: true,
        comment: "Checked against BCKV Mohanpur agricultural farm spray guidelines."
      },
      {
        id: "rev-102",
        lang: "Marathi (mr)",
        key: "emergency_and_first_aid.swallowing_warning",
        source: "If swallowed, do NOT induce vomiting unless instructed by a qualified medical doctor.",
        proposed: "औषध पोटात गेल्यास, वैद्यकीय डॉक्टरांनी सांगितल्याशिवाय उलटी करण्याचा प्रयत्न करू नका.",
        contributor: "Dr_Pawar_KVK",
        timestamp: "1 hour ago",
        status: "APPROVED",
        isSafetyCritical: true,
        comment: "Verified negation 'करू नका' is accurate to prevent aspiration pneumonia."
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('portal');
      const [selectedLang, setSelectedLang] = useState('bn');
      const [reviews, setReviews] = useState(INITIAL_REVIEWS);
      const [portalInput, setPortalInput] = useState('');
      const [liveSafetyAlert, setLiveSafetyAlert] = useState(null);
      const [copySuccess, setCopySuccess] = useState(false);

      // Playground state
      const [simSource, setSimSource] = useState('Do NOT induce vomiting. Administer 2 to 4 mg Atropine.');
      const [simTarget, setSimTarget] = useState('उल्टी कराएं। 20 mg एट्रोपिन दें।'); // Intentional safety regression test

      // Live safety validation on translation typing
      useEffect(() => {
        if (!portalInput) {
          setLiveSafetyAlert(null);
          return;
        }

        const issues = [];
        // Check if placeholder {dose_amount} dropped
        if (!portalInput.includes('{dose_amount}')) {
          issues.push("⚠️ Missing critical placeholder: {dose_amount}");
        }
        if (!portalInput.includes('{water_volume}')) {
          issues.push("⚠️ Missing critical placeholder: {water_volume}");
        }
        setLiveSafetyAlert(issues.length > 0 ? issues : null);
      }, [portalInput]);

      const handleApprove = (id) => {
        setReviews(reviews.map(r => r.id === id ? { ...r, status: 'APPROVED' } : r));
      };

      const handleRequestRevision = (id) => {
        setReviews(reviews.map(r => r.id === id ? { ...r, status: 'REVISION_REQUESTED' } : r));
      };

      const handleSubmitTranslation = () => {
        if (!portalInput) return;
        const newRev = {
          id: `rev-${Date.now().toString(36)}`,
          lang: "Bengali (bn)",
          key: "dosage_and_mixing.dosage_instruction",
          source: "Mix exactly {dose_amount} per {water_volume} of clean water.",
          proposed: portalInput,
          contributor: "Community_Volunteer_" + Math.floor(Math.random() * 1000),
          timestamp: "Just now",
          status: "PENDING",
          isSafetyCritical: true,
          comment: "Submitted via Community Translation Portal"
        };
        setReviews([newRev, ...reviews]);
        setPortalInput('');
        alert("🎉 Translation submitted to review queue! Peer agronomists will verify safety terminology.");
      };

      const copyGoodFirstIssue = () => {
        const text = `## 🌐 [Good First Issue] Add missing Bengali (bn) pesticide safety translations
**Language:** Bengali (বাংলা) (bn) | **Coverage:** 42.4% complete
**File:** locales/bn.json

### 📋 Missing Safety Checklist:
- [ ] \`dosage_and_mixing.dosage_instruction\` (⚠️ Safety-Critical)
  - English: "Mix exactly {dose_amount} per {water_volume} of clean water."
- [ ] \`emergency_and_first_aid.antidote_atropine\` (⚠️ Safety-Critical)
  - English: "Administer Atropine sulphate (2 to 4 mg intravenously) under qualified medical supervision until atropinization symptoms appear."

Run \`npm test\` to verify safety validation before opening PR!`;
        navigator.clipboard.writeText(text);
        setCopySuccess(true);
        setTimeout(() => setCopySuccess(false), 2500);
      };

      // Simulator evaluation
      const evaluateSimulator = () => {
        const issues = [];
        const targetLower = simTarget.toLowerCase();

        // 1. Ingestion negation check
        if (simSource.toLowerCase().includes('not induce vomiting')) {
          const negations = ['not', 'never', 'न', 'नहीं', 'मत', 'नका', 'नाही', 'వద్దు', 'రాదు'];
          const tokens = targetLower.split(/[\s,।.;:!?]+/);
          const hasNegation = negations.some(n => tokens.includes(n) || targetLower.includes(n));
          if (!hasNegation) {
            issues.push({
              sev: 'CRITICAL',
              text: 'Missing negation! Saying "induce vomiting" instead of "do NOT induce vomiting" causes fatal lung aspiration.'
            });
          }
        }

        // 2. Numerical alteration
        const srcNums = simSource.match(/\b\d+\b/g) || [];
        const tgtNums = simTarget.match(/\b\d+\b/g) || [];
        srcNums.forEach(n => {
          if (!tgtNums.includes(n)) {
            issues.push({
              sev: 'CRITICAL',
              text: `Dosage number altered or dropped! Original required '${n}', but target contains '${tgtNums.join(', ') || 'none'}'. Overdosing burns crops and poisons farmers.`
            });
          }
        });

        return issues;
      };

      const simIssues = evaluateSimulator();

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          {/* Header */}
          <header className="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-slate-800 gap-4">
            <div>
              <div className="flex items-center gap-3">
                <span className="text-3xl">🌾</span>
                <h1 className="text-2xl font-bold tracking-tight text-white">KisanVaani AI</h1>
                <span className="badge-cibrc text-xs font-semibold px-2.5 py-1 rounded-full text-white shadow-sm">
                  CIBRC Safety Verified
                </span>
                <span className="bg-blue-600/30 text-blue-400 border border-blue-500/30 text-xs px-2.5 py-1 rounded-full">
                  Open Source Platform
                </span>
              </div>
              <p className="text-slate-400 text-sm mt-1">
                Community translation portal, automated agricultural safety regression tests, and pluggable AI engines.
              </p>
            </div>

            <div className="flex items-center gap-2">
              <a href="https://github.com" target="_blank" className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-lg text-sm border border-slate-700 transition">
                <span>⭐ GitHub Good First Issues</span>
              </a>
            </div>
          </header>

          {/* Navigation Tabs */}
          <nav className="flex overflow-x-auto gap-2 my-6 pb-2 border-b border-slate-800 text-sm">
            {[
              { id: 'portal', label: '1. Community Translation Portal', icon: '🌐' },
              { id: 'review', label: '2. Review & Approval Workflow', icon: '✅' },
              { id: 'detector', label: '3. Missing Language Detector', icon: '🔍' },
              { id: 'regression', label: '4. Safety Regression Sandbox', icon: '🛡️' },
              { id: 'dataset', label: '5. Public Pesticide Dataset', icon: '📊' },
              { id: 'adapters', label: '6. Pluggable OCR & Speech', icon: '🔌' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex items-center gap-2 px-4 py-2.5 rounded-lg font-medium whitespace-nowrap transition ${
                  activeTab === tab.id
                    ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/30'
                    : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                }`}
              >
                <span>{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </nav>

          {/* Tab 1: Community Translation Portal */}
          {activeTab === 'portal' && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-2 space-y-6">
                <div className="bg-slate-800/60 border border-slate-700 rounded-xl p-6 shadow-sm">
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                      <span>✏️ Translate Pesticide Safety Instructions</span>
                    </h2>
                    <select
                      value={selectedLang}
                      onChange={e => setSelectedLang(e.target.value)}
                      className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                    >
                      <option value="bn">Bengali (বাংলা) — 42.4% Complete</option>
                      <option value="mr">Marathi (मराठी) — 100% Complete</option>
                      <option value="hi">Hindi (हिन्दी) — 100% Complete</option>
                      <option value="ta">Tamil (தமிழ்) — Needs Contributor</option>
                      <option value="gu">Gujarati (ગુજરાતી) — Needs Contributor</option>
                    </select>
                  </div>

                  <div className="space-y-4">
                    <div className="bg-slate-900/80 p-4 rounded-lg border border-slate-700/60">
                      <div className="flex items-center justify-between text-xs text-slate-400 mb-1">
                        <span className="font-mono text-emerald-400">dosage_and_mixing.dosage_instruction</span>
                        <span className="bg-red-950 text-red-300 border border-red-800 px-2 py-0.5 rounded text-[11px] font-semibold">
                          ⚠️ Safety Critical
                        </span>
                      </div>
                      <p className="text-sm font-medium text-slate-200 mt-2">
                        English Source:
                      </p>
                      <p className="text-sm text-slate-300 bg-slate-800 p-2.5 rounded mt-1 font-mono">
                        "Mix exactly {"{dose_amount}"} per {"{water_volume}"} of clean water."
                      </p>
                      <p className="text-xs text-slate-400 mt-2">
                        💡 Rule: Do NOT remove dynamic variables <code className="text-emerald-400">{"{dose_amount}"}</code> and <code className="text-emerald-400">{"{water_volume}"}</code>. Overdosing causes crop burning.
                      </p>
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-1">
                        Your Regional Translation ({selectedLang === 'bn' ? 'Bengali (বাংলা)' : selectedLang}):
                      </label>
                      <textarea
                        rows="3"
                        value={portalInput}
                        onChange={e => setPortalInput(e.target.value)}
                        placeholder="পরিষ্কার জলের প্রতি {water_volume} এ ঠিক {dose_amount} মেশান..."
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"
                      ></textarea>

                      {liveSafetyAlert && (
                        <div className="mt-2 p-3 bg-red-950/60 border border-red-800 rounded-lg text-xs text-red-300 space-y-1">
                          {liveSafetyAlert.map((alert, i) => (
                            <p key={i} className="font-medium">{alert}</p>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="flex items-center justify-between pt-2">
                      <span className="text-xs text-slate-400">
                        Peer reviewed by agricultural scientists before publishing.
                      </span>
                      <button
                        onClick={handleSubmitTranslation}
                        disabled={!portalInput.trim()}
                        className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-medium px-4 py-2 rounded-lg text-sm transition shadow-sm"
                      >
                        Submit Translation for Review →
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              {/* Sidebar: Contribution Guidelines */}
              <div className="space-y-6">
                <div className="bg-slate-800/40 border border-slate-700/80 rounded-xl p-5">
                  <h3 className="font-semibold text-white text-sm mb-3 flex items-center gap-2">
                    <span>🌱 Open Source First Contribution</span>
                  </h3>
                  <ul className="text-xs text-slate-300 space-y-2.5">
                    <li className="flex items-start gap-2">
                      <span className="text-emerald-400">✓</span>
                      <span>No coding needed: Translate JSON strings directly in browser or GitHub.</span>
                    </li>
                    <li className="flex items-start gap-2">
                      <span className="text-emerald-400">✓</span>
                      <span>Zero AI API cost: Work completely offline with built-in mock engines.</span>
                    </li>
                    <li className="flex items-start gap-2">
                      <span className="text-emerald-400">✓</span>
                      <span>Automated Safety Regression Gate catches dosage typos on every pull request.</span>
                    </li>
                  </ul>
                  <div className="mt-4 pt-4 border-t border-slate-700/60">
                    <button
                      onClick={copyGoodFirstIssue}
                      className="w-full bg-slate-700 hover:bg-slate-600 text-white text-xs font-medium py-2 rounded-lg transition"
                    >
                      {copySuccess ? "✓ Copied to Clipboard!" : "📋 Copy Good First Issue Template"}
                    </button>
                  </div>
                </div>

                <div className="bg-slate-800/40 border border-slate-700/80 rounded-xl p-5 text-xs text-slate-400">
                  <h4 className="font-semibold text-slate-200 mb-2">Statutory CIBRC Color Codes</h4>
                  <div className="space-y-1.5">
                    <div className="flex items-center justify-between"><span className="text-red-400 font-medium">Red Triangle</span><span>Extremely Toxic</span></div>
                    <div className="flex items-center justify-between"><span className="text-yellow-400 font-medium">Yellow Triangle</span><span>Highly Toxic</span></div>
                    <div className="flex items-center justify-between"><span className="text-blue-400 font-medium">Blue Triangle</span><span>Moderately Toxic</span></div>
                    <div className="flex items-center justify-between"><span className="text-emerald-400 font-medium">Green Triangle</span><span>Slightly Toxic</span></div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Tab 2: Translation Review & Approval Workflow */}
          {activeTab === 'review' && (
            <div className="space-y-6">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-lg font-semibold text-white">Review & Approval Queue</h2>
                  <p className="text-xs text-slate-400">Reviewers verify agricultural terminology and dosage integrity before merging into production locale files.</p>
                </div>
                <span className="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">
                  {reviews.filter(r => r.status === 'PENDING').length} Pending Reviews
                </span>
              </div>

              <div className="space-y-4">
                {reviews.map(item => (
                  <div key={item.id} className="bg-slate-800/60 border border-slate-700 rounded-xl p-5 space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-700/60 pb-3">
                      <div className="flex items-center gap-2">
                        <span className="font-semibold text-sm text-white">{item.lang}</span>
                        <span className="text-xs font-mono text-emerald-400 bg-slate-900 px-2 py-0.5 rounded">{item.key}</span>
                        {item.isSafetyCritical && (
                          <span className="bg-red-950 text-red-300 border border-red-800 text-[10px] px-2 py-0.5 rounded font-medium">
                            Safety Critical
                          </span>
                        )}
                      </div>
                      <div className="flex items-center gap-3 text-xs text-slate-400">
                        <span>Submitted by <strong className="text-slate-300">{item.contributor}</strong></span>
                        <span>•</span>
                        <span>{item.timestamp}</span>
                        <span className={`px-2 py-0.5 rounded font-semibold text-[11px] ${
                          item.status === 'APPROVED' ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' :
                          item.status === 'REVISION_REQUESTED' ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                          'bg-blue-950 text-blue-300 border border-blue-800'
                        }`}>
                          {item.status}
                        </span>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                      <div className="bg-slate-900/80 p-3 rounded-lg border border-slate-700/50">
                        <span className="text-slate-400 font-medium block mb-1">Source (English):</span>
                        <p className="text-slate-200 font-mono">{item.source}</p>
                      </div>
                      <div className="bg-slate-900/80 p-3 rounded-lg border border-slate-700/50">
                        <span className="text-emerald-400 font-medium block mb-1">Proposed Regional Translation:</span>
                        <p className="text-slate-100 font-mono font-medium">{item.proposed}</p>
                      </div>
                    </div>

                    {item.comment && (
                      <div className="text-xs text-slate-400 bg-slate-900/40 p-2.5 rounded border border-slate-800 flex items-center gap-2">
                        <span>💬</span>
                        <span>{item.comment}</span>
                      </div>
                    )}

                    <div className="flex items-center justify-end gap-3 pt-2">
                      <button
                        onClick={() => handleRequestRevision(item.id)}
                        className="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium px-3.5 py-1.5 rounded transition"
                      >
                        Request Agronomist Revision
                      </button>
                      <button
                        onClick={() => handleApprove(item.id)}
                        disabled={item.status === 'APPROVED'}
                        className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-medium px-3.5 py-1.5 rounded transition"
                      >
                        {item.status === 'APPROVED' ? '✓ Approved & Merged' : 'Approve & Publish to locales/*.json'}
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Tab 3: Missing Language Detector */}
          {activeTab === 'detector' && (
            <div className="space-y-6">
              <div>
                <h2 className="text-lg font-semibold text-white">Missing Translation Audit & Good First Issue Hub</h2>
                <p className="text-xs text-slate-400">Scans locale files, identifies untranslated strings, and creates ready-to-claim GitHub tasks for new contributors.</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {[
                  { lang: 'Hindi (hi)', coverage: 100, missing: 0, status: 'Ready for production' },
                  { lang: 'Marathi (mr)', coverage: 100, missing: 0, status: 'Ready for production' },
                  { lang: 'Bengali (bn)', coverage: 42.4, missing: 19, status: 'Good First Issue available' },
                  { lang: 'Tamil (ta)', coverage: 0, missing: 33, status: 'New language needed' },
                  { lang: 'Gujarati (gu)', coverage: 0, missing: 33, status: 'New language needed' },
                  { lang: 'Kannada (kn)', coverage: 0, missing: 33, status: 'New language needed' }
                ].map((item, i) => (
                  <div key={i} className="bg-slate-800/60 border border-slate-700 p-4 rounded-xl space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="font-semibold text-sm text-white">{item.lang}</h3>
                      <span className="text-xs font-mono font-semibold text-emerald-400">{item.coverage}%</span>
                    </div>
                    <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-700/50">
                      <div className="bg-emerald-500 h-full rounded-full transition-all duration-500" style={{ width: `${item.coverage}%` }}></div>
                    </div>
                    <div className="flex items-center justify-between text-xs text-slate-400 pt-1">
                      <span>{item.missing} strings missing</span>
                      <span className="text-slate-300 font-medium">{item.status}</span>
                    </div>
                  </div>
                ))}
              </div>

              <div className="bg-slate-800/40 border border-slate-700 rounded-xl p-5 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-semibold text-white">CLI Command for Local Developers</h3>
                  <span className="text-xs text-slate-400">Run anytime in terminal</span>
                </div>
                <pre className="bg-slate-950 p-3 rounded-lg text-xs font-mono text-emerald-400 overflow-x-auto">
npm run detect:missing -- --export-issues
                </pre>
                <p className="text-xs text-slate-400">
                  Automatically generates structured Markdown issue files inside <code className="text-slate-200">.github/generated_issues/</code> with checklists for all missing strings.
                </p>
              </div>
            </div>
          )}

          {/* Tab 4: Automated Safety Regression Sandbox */}
          {activeTab === 'regression' && (
            <div className="space-y-6">
              <div>
                <h2 className="text-lg font-semibold text-white">Automated Safety Regression Test Sandbox</h2>
                <p className="text-xs text-slate-400">
                  Simulate CI safety gates! Test what happens when a translation changes a critical number or removes a medical negation.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">
                      English Source Safety Rule:
                    </label>
                    <textarea
                      rows="3"
                      value={simSource}
                      onChange={e => setSimSource(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-emerald-500"
                    ></textarea>
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">
                      Target Translation (Try altering numbers or removing negation to trigger CI error):
                    </label>
                    <textarea
                      rows="3"
                      value={simTarget}
                      onChange={e => setSimTarget(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-emerald-500"
                    ></textarea>
                  </div>

                  <div className="flex gap-2">
                    <button
                      onClick={() => setSimTarget('उल्टी कराएं। 20 mg एट्रोपिन दें।')}
                      className="bg-red-900/50 hover:bg-red-900 border border-red-700 text-red-200 text-xs px-3 py-1.5 rounded transition"
                    >
                      Load Dangerous Mistake Sample
                    </button>
                    <button
                      onClick={() => setSimTarget('उल्टी न कराएं। 2 से 4 mg एट्रोपिन दें।')}
                      className="bg-emerald-900/50 hover:bg-emerald-900 border border-emerald-700 text-emerald-200 text-xs px-3 py-1.5 rounded transition"
                    >
                      Load Safe Translation Sample
                    </button>
                  </div>
                </div>

                {/* Validation Output */}
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                      <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">CI Safety Gate Status</span>
                      <span className={`text-xs font-bold px-2.5 py-0.5 rounded ${
                        simIssues.length === 0 ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800'
                      }`}>
                        {simIssues.length === 0 ? '✅ PASSED — MERGE ALLOWED' : '❌ BLOCKED — MERGE REJECTED'}
                      </span>
                    </div>

                    <div className="mt-4 space-y-3">
                      {simIssues.length === 0 ? (
                        <div className="text-center py-8">
                          <span className="text-3xl">🛡️</span>
                          <p className="text-emerald-400 font-semibold text-sm mt-2">Zero Safety Regressions Detected</p>
                          <p className="text-xs text-slate-400 mt-1">All dosages, numerical values, and medical negations preserved accurately.</p>
                        </div>
                      ) : (
                        simIssues.map((iss, i) => (
                          <div key={i} className="bg-red-950/40 border border-red-800/80 p-3 rounded-lg text-xs space-y-1">
                            <span className="font-bold text-red-400">🔴 {iss.sev} SEVERITY ISSUE</span>
                            <p className="text-slate-300">{iss.text}</p>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-800 text-xs text-slate-500 font-mono">
                    Run in CLI: npm test
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Tab 5: Public Pesticide Label Dataset */}
          {activeTab === 'dataset' && (
            <div className="space-y-6">
              <div>
                <h2 className="text-lg font-semibold text-white">Public CIBRC Pesticide-Label Dataset</h2>
                <p className="text-xs text-slate-400">
                  Searchable, open-source dataset of legally shareable label info, approved crops, and reviewed safety instructions. Free of personal info.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {SAMPLE_DATASET.map(item => (
                  <div key={item.id} className="bg-slate-800/60 border border-slate-700 rounded-xl p-5 space-y-3">
                    <div className="flex items-start justify-between">
                      <div>
                        <span className="text-[11px] font-mono text-emerald-400">{item.id}</span>
                        <h3 className="font-bold text-base text-white">{item.name}</h3>
                      </div>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${item.triangleClass}`}>
                        {item.triangle} Triangle
                      </span>
                    </div>

                    <div className="text-xs space-y-1.5 text-slate-300">
                      <div><strong className="text-slate-400">Approved Crops:</strong> {item.crops}</div>
                      <div><strong className="text-slate-400">Dosage Rate:</strong> <span className="text-emerald-400 font-mono">{item.dose}</span></div>
                      <div><strong className="text-slate-400">Waiting Period (PHI):</strong> {item.phi}</div>
                    </div>

                    <div className="pt-2 border-t border-slate-700/60 text-xs">
                      <strong className="text-slate-400 block mb-0.5">Antidote & First Aid:</strong>
                      <p className="text-slate-300 bg-slate-900 p-2 rounded text-[11px]">{item.antidote}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Tab 6: Pluggable OCR & Speech Engines */}
          {activeTab === 'adapters' && (
            <div className="space-y-6">
              <div>
                <h2 className="text-lg font-semibold text-white">Pluggable Provider Adapters</h2>
                <p className="text-xs text-slate-400">
                  Contributors can add OCR, speech-to-text, and translation engines independently without altering core application logic.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-slate-800/60 border border-slate-700 rounded-xl p-5 space-y-3">
                  <h3 className="font-semibold text-sm text-white flex items-center gap-2">
                    <span>📷 Pluggable OCR Engine Interface</span>
                  </h3>
                  <p className="text-xs text-slate-300">
                    Switch between local Tesseract, Google Cloud Vision, or Mock Mode for offline zero-cost testing.
                  </p>
                  <pre className="bg-slate-950 p-3 rounded-lg text-xs font-mono text-slate-300 overflow-x-auto">
const { getOCREngine, registerOCREngine } = require('./packages/ocr/ocr-adapter.js');

// Built-in Mock Mode: Zero API keys needed!
const engine = getOCREngine('mock');
const label = await engine.extractStructuredLabel(imageBuffer);
                  </pre>
                  <span className="inline-block text-[11px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-1 rounded">
                    Active Provider: MockOCREngine (Local Zero-Cost)
                  </span>
                </div>

                <div className="bg-slate-800/60 border border-slate-700 rounded-xl p-5 space-y-3">
                  <h3 className="font-semibold text-sm text-white flex items-center gap-2">
                    <span>🎙️ Pluggable Speech Engine Interface</span>
                  </h3>
                  <p className="text-xs text-slate-300">
                    Switch between Web Speech API, Whisper, Bhashini AI, or offline Mock Speech.
                  </p>
                  <pre className="bg-slate-950 p-3 rounded-lg text-xs font-mono text-slate-300 overflow-x-auto">
const { getSpeechEngine } = require('./packages/speech/speech-adapter.js');

const speech = getSpeechEngine('mock');
const transcript = await speech.transcribeAudio(stream, 'hi');
                  </pre>
                  <span className="inline-block text-[11px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-1 rounded">
                    Active Provider: MockSpeechEngine (Local Zero-Cost)
                  </span>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-12 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
            KisanVaani AI — Open Source Agricultural Safety Platform. Released under Apache-2.0 License.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
