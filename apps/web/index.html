                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {/* Organic Remedy */}
                      <div className="p-4 rounded-xl bg-emerald-950/30 border border-emerald-800/40 space-y-2">
                        <span className="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                          <span>🌱</span> {t.doctor.organicLabel}
                        </span>
                        <p className="text-xs text-slate-200 leading-relaxed">
                          {currentDisease.organic[lang] || currentDisease.organic.en}
                        </p>
                      </div>

                      {/* Chemical Remedy */}
                      <div className="p-4 rounded-xl bg-blue-950/30 border border-blue-800/40 space-y-2">
                        <span className="text-xs font-bold text-blue-400 flex items-center gap-1.5">
                          <span>🧪</span> {t.doctor.chemicalLabel}
                        </span>
                        <p className="text-xs text-slate-200 leading-relaxed font-mono text-[11px]">
                          {currentDisease.chemical[lang] || currentDisease.chemical.en}
                        </p>
                      </div>
                    </div>

                    {/* Safety, Dosage & Waiting Period */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs pt-2">
                      <div className="p-3 rounded-xl bg-slate-950 border border-slate-800">
                        <span className="text-slate-400 block text-[11px]">{t.doctor.acreDoseLabel}</span>
                        <span className="font-semibold text-emerald-400 font-mono mt-0.5 block">
                          {currentDisease.dosage[lang] || currentDisease.dosage.en}
                        </span>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-950 border border-slate-800">
                        <span className="text-slate-400 block text-[11px]">{t.doctor.phiLabel}</span>
                        <span className="font-semibold text-amber-400 mt-0.5 block">
                          {currentDisease.phi[lang] || currentDisease.phi.en}
                        </span>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-950 border border-slate-800">
                        <span className="text-slate-400 block text-[11px]">{t.doctor.emergencyLabel}</span>
                        <span className="font-semibold text-red-400 mt-0.5 block">{t.doctor.emergencyVal}</span>
                      </div>
                    </div>

                    <div className="p-3 rounded-xl bg-red-950/30 border border-red-800/40 text-xs text-red-300 flex items-start gap-2">
                      <span>⚠️</span>
                      <span><strong>{t.doctor.cautionLabel}</strong> {currentDisease.caution[lang] || currentDisease.caution.en}</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: DHENU MARKETS (LIVE MANDI PRICES) */}
            {activeTab === 'mandi' && (
              <div className="space-y-6">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <span>📈 {t.mandi.title}</span>
                    </h2>
                    <p className="text-xs text-slate-400 mt-1">
                      {t.mandi.desc}
                    </p>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-slate-300 font-mono">
                      {t.mandi.updatedAt}
                    </span>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {MULTI_MANDI.map((item, i) => (
                    <div key={i} className="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl space-y-3 hover:border-slate-700 transition">
                      <div className="flex items-start justify-between">
                        <div>
                          <span className="text-xs text-slate-400 block">{item.markets[lang] || item.markets.en}</span>
                          <h3 className="font-bold text-base text-white mt-0.5">{item.crops[lang] || item.crops.en}</h3>
                        </div>
                        <span className={`text-xs px-2 py-0.5 rounded-full font-bold flex items-center gap-0.5 ${
                          item.status === 'up' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800'
                        }`}>
                          {item.status === 'up' ? '▲' : '▼'} {item.change}
                        </span>
                      </div>

                      <div className="pt-2 border-t border-slate-800/80">
                        <span className="text-2xl font-extrabold text-white">₹{item.price.toLocaleString()}</span>
                        <span className="text-xs text-slate-400 ml-1">{t.mandi.perQuintal}</span>
                      </div>

                      <div className="text-[11px] text-slate-400 flex items-center justify-between pt-1">
                        <span>{t.mandi.modalPrice}</span>
                        <button onClick={() => alert('Mandi trends modal')} className="text-emerald-400 hover:underline">
                          {t.mandi.detailsChart}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="space-y-1">
                    <h3 className="font-bold text-sm text-white">{t.mandi.alertCardTitle}</h3>
                    <p className="text-xs text-slate-400">{t.mandi.alertCardDesc}</p>
                  </div>
                  <button onClick={() => alert('WhatsApp price alert enabled')} className="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-5 py-2.5 rounded-xl transition">
                    {t.mandi.alertCardBtn}
                  </button>
                </div>
              </div>
            )}

            {/* TAB 4: PESTICIDE & SPRAY CALCULATOR */}
            {activeTab === 'calculator' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <span>🧪 {t.calculator.title}</span>
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    {t.calculator.desc}
                  </p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  {/* Input Form */}
                  <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                    <h3 className="font-semibold text-sm text-white">{t.calculator.paramsTitle}</h3>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">{t.calculator.cropType}</label>
                      <select
                        value={calcCrop}
                        onChange={e => setCalcCrop(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                      >
                        <option value="paddy">Paddy (Tricyclazole / Chlorpyrifos)</option>
                        <option value="cotton">Cotton (Emamectin / Imidacloprid)</option>
                        <option value="potato">Potato (Mancozeb 75% WP)</option>
                        <option value="tomato">Tomato (Azoxystrobin SC)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">{t.calculator.landArea}</label>
                      <input
                        type="number"
                        min="0.5"
                        step="0.5"
                        value={calcArea}
                        onChange={e => setCalcArea(parseFloat(e.target.value) || 1)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 font-mono"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">{t.calculator.tankSize}</label>
                      <select
                        value={calcTank}
                        onChange={e => setCalcTank(parseInt(e.target.value))}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                      >
                        <option value="16">16 L (Knapsack manual sprayer)</option>
                        <option value="20">20 L (Battery operated knapsack)</option>
                        <option value="200">200 L (Tractor barrel tank)</option>
                      </select>
                    </div>
                  </div>

                  {/* Calculated Output Card */}
                  <div className="lg:col-span-2 bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-6">
                    <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                      <div>
                        <span className="text-xs text-emerald-400 font-semibold uppercase tracking-wider">{t.calculator.resultHeader}</span>
                        <h3 className="text-base font-bold text-white mt-0.5">{t.calculator.forYourLand} ({calcArea} Acres)</h3>
                      </div>
                      <span className="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1 rounded-full font-bold">
                        {t.calculator.antiOverdose}
                      </span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-1">
                        <span className="text-xs text-slate-400">{t.calculator.perTankDose}</span>
                        <span className="text-xl font-extrabold text-emerald-400 font-mono block">
                          {(calcTank * 2.0).toFixed(0)} g/ml
                        </span>
                        <span className="text-[11px] text-slate-500">Per {calcTank} L water</span>
                      </div>

                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-1">
                        <span className="text-xs text-slate-400">{t.calculator.waterTotal}</span>
                        <span className="text-xl font-extrabold text-blue-400 font-mono block">
                          {(calcArea * 200).toFixed(0)} L
                        </span>
                        <span className="text-[11px] text-slate-500">{Math.ceil((calcArea * 200) / calcTank)} Tanks Total</span>
                      </div>

                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-1">
                        <span className="text-xs text-slate-400">{t.calculator.chemTotal}</span>
                        <span className="text-xl font-extrabold text-amber-400 font-mono block">
                          {(calcArea * 400).toFixed(0)} g/ml
                        </span>
                        <span className="text-[11px] text-slate-500">For {calcArea} Acres</span>
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-slate-950/60 border border-slate-800 space-y-2">
                      <h4 className="font-semibold text-xs text-slate-200">{t.calculator.goldenRules}</h4>
                      <ul className="text-xs text-slate-400 space-y-1 list-disc list-inside">
                        <li>{t.calculator.rule1}</li>
                        <li>{t.calculator.rule2}</li>
                        <li>{t.calculator.rule3}</li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: GOVT SCHEMES & SUBSIDIES */}
            {activeTab === 'schemes' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <span>🏛️ {t.schemes.title}</span>
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    {t.schemes.desc}
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {MULTI_SCHEMES.map((s, idx) => (
                    <div key={idx} className="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl flex flex-col justify-between space-y-4">
                      <div className="space-y-2.5">
                        <span className="text-[11px] font-mono text-emerald-400 uppercase tracking-wider">{s.dept}</span>
                        <h3 className="font-bold text-base text-white">{s.names[lang] || s.names.en}</h3>
                        <div className="text-xs space-y-1.5 text-slate-300">
                          <div><strong className="text-slate-400">{t.schemes.benefitLabel}</strong> {s.benefits[lang] || s.benefits.en}</div>
                          <div><strong className="text-slate-400">{t.schemes.eligibilityLabel}</strong> {s.eligibility[lang] || s.eligibility.en}</div>
                        </div>
                      </div>

                      <button
                        onClick={() => alert((s.names[lang] || s.names.en) + ' application modal')}
                        className="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs py-2.5 rounded-xl transition border border-slate-700/60"
                      >
                        {s.action[lang] || s.action.en}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="mt-12 border-t border-slate-800/80 bg-slate-950 py-8 px-4 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="text-emerald-400 font-bold text-sm">KissanAI</span>
                <span>•</span>
                <span>Dhenu Agricultural Foundation Model Architecture</span>
              </div>
              <p>{t.footer.copyright}</p>
              <div className="flex gap-4">
                <a href="https://github.com/guptavedansh665-glitch/Hackday-Hactober" target="_blank" className="hover:text-emerald-400">GitHub</a>
                <a href="#" className="hover:text-emerald-400">{t.footer.privacy}</a>
                <a href="#" className="hover:text-emerald-400">{t.footer.terms}</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
