            setIsListening(false);

                        <span className="text-xs text-slate-400">মোট ওষুধ প্রয়োজন:</span>
                        <span className="text-xl font-extrabold text-amber-400 font-mono block">
                          {(calcArea * 400).toFixed(0)} গ্রাম/মিলি
                        </span>
                        <span className="text-[11px] text-slate-500">{calcArea} একর মোট ক্ষেত্রফল</span>
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-slate-950/60 border border-slate-800 space-y-2">
                      <h4 className="font-semibold text-xs text-slate-200">কৃষি বিজ্ঞানীদের স্প্রে করার সুবর্ণ নিয়ম:</h4>
                      <ul className="text-xs text-slate-400 space-y-1 list-disc list-inside">
                        <li>কখনই নির্দেশিত মাত্রার চেয়ে বেশি স্প্রে করবেন না; এতে ফসলে কেমিক্যাল বার্ন হয়।</li>
                        <li>ন্যাপস্যাক স্প্রেয়ারের নোজল সমান্তরাল রাখুন এবং খালি পেটে স্প্রে করবেন না।</li>
                        <li>খালি ওষুধের বোতল বা প্যাকেট পুকুর ও খালবিল থেকে দূরে মাটিতে পুঁতে ফেলুন।</li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: GOVT SCHEMES & SUBSIDIES */}
            {activeTab === 'schemes' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <span>🏛️ কেন্দ্রীয় ও রাজ্য সরকারি কৃষক যোজনা ডিরেক্টরি</span>
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    কৃষকদের জন্য সরকারি অনুদান, ভর্তুকিযুক্ত কৃষি যন্ত্রপাতি ও ফসল বিমার আবেদন প্রক্রিয়া।
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {[
                    {
                      name: "প্রধানমন্ত্রী কিষাণ সম্মান নিধি (PM-Kisan)",
                      dept: "কৃষি ও কৃষক কল্যাণ মন্ত্রক",
                      benefit: "বার্ষিক ₹৬,০০০ সরাসরি ব্যাংক একাউন্টে (প্রতি ৪ মাসে ₹২,০০০)",
                      eligibility: "সকল ক্ষুদ্র ও প্রান্তিক চাষী পরিবার যাদের আবাদি জমি রয়েছে।",
                      action: "কেওয়াইসি স্ট্যাটাস চেক করুন"
                    },
                    {
                      name: "প্রধানমন্ত্রী ফসল বিমা যোজনা (PMFBY)",
                      dept: "জাতীয় ফসল বিমা পোর্টাল",
                      benefit: "খরা, অতিবৃষ্টি, শিলাবৃষ্টি বা কীটপতঙ্গের আক্রমণে ফসলের ক্ষতিপূরণ।",
                      eligibility: "খরিফ ফসলে ২% ও রবি ফসলে ১.৫% নামমাত্র প্রিমিয়ামে সম্পূর্ণ কভারেজ।",
                      action: "বিমা দাবি ও পলিসি স্ট্যাটাস"
                    },
                    {
                      name: "পিএম কুসুম সোলার পাম্প যোজনা (PM-KUSUM)",
                      dept: "পুনর্নবীকরণযোগ্য শক্তি মন্ত্রক",
                      benefit: "সৌরশক্তি চালিত সেচ পাম্প স্থাপনে ৬০% পর্যন্ত সরকারি ভর্তুকি।",
                      eligibility: "যেসব চাষীর সেচের জন্য বিদ্যুৎ সংযোগ নেই বা ডিজেল পাম্প ব্যবহার করেন।",
                      action: "সোলার পাম্পের আবেদন করুন"
                    }
                  ].map((s, idx) => (
                    <div key={idx} className="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl flex flex-col justify-between space-y-4">
                      <div className="space-y-2.5">
                        <span className="text-[11px] font-mono text-emerald-400 uppercase tracking-wider">{s.dept}</span>
                        <h3 className="font-bold text-base text-white">{s.name}</h3>
                        <div className="text-xs space-y-1.5 text-slate-300">
                          <div><strong className="text-slate-400">সুবিধা:</strong> {s.benefit}</div>
                          <div><strong className="text-slate-400">যোগ্যতা:</strong> {s.eligibility}</div>
                        </div>
                      </div>

                      <button
                        onClick={() => alert(`${s.name} সংক্রান্ত বিস্তারিত বিবরণ ও আবেদন লিঙ্ক তৈরি হচ্ছে...`)}
                        className="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs py-2.5 rounded-xl transition border border-slate-700/60"
                      >
                        {s.action} →
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="mt-12 border-t border-slate-800/80 bg-slate-950 py-8 px-4 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="text-emerald-400 font-bold text-sm">KissanAI</span>
                <span>•</span>
                <span>Dhenu Agricultural Foundation Model Architecture</span>
              </div>
              <p>© 2026 KissanAI. Open Source Platform dedicated to Indian Farmers.</p>
              <div className="flex gap-4">
                <a href="https://github.com/guptavedansh665-glitch/Hackday-Hactober" target="_blank" className="hover:text-emerald-400">GitHub</a>
                <a href="#" className="hover:text-emerald-400">Privacy Policy</a>
                <a href="#" className="hover:text-emerald-400">Terms of Service</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
